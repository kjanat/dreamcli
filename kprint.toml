#:schema https://raw.githubusercontent.com/kjanat/kjanat/refs/heads/master/schemas/dprint.schema.json

useTabs     = true
indentWidth = 2
newLineKind = "lf"
lineWidth   = 100
excludes    = ["**/node_modules", "**/{*-,bun}lock(.*)?", "**/snapshots"]
plugins     = [
  "https://plugins.dprint.dev/kjanat/svg-v0.4.1.wasm",
  "https://plugins.dprint.dev/kjanat/sortpackagejson-0.2.1.wasm",
  "npm:@dprint/biome@0.15.8",
  "npm:@dprint/markdown@0.29.0",
  "npm:@dprint/ruff@0.12.3",
  "npm:@dprint/json@0.26.0",
  "npm:dprint-plugin-malva@0.16.1",
  "npm:dprint-plugin-markup@0.28.0",
  "npm:dprint-plugin-yaml@0.6.0",
  "https://plugins.dprint.dev/kjanat/json-schema-sort-0.1.2.wasm",
  "https://plugins.dprint.dev/kjanat/tombi-0.2.1.wasm",
]

[jsonSchemaSort]
associations = ["**/schema.json", "**/*.schema.json"]

[biome]
indentStyle   = "tab"
indentWidth   = 2
lineWidth     = 100
quoteStyle    = "single"
"css.enabled" = true
associations  = ["*.ts.tpl"]

[[biome.overrides]]
files       = ["docs/.vitepress/twoslash/*.ts"]
lineWidth   = 60
indentStyle = "space"

[markdown]
"codeBlock.useTabs" = false
textWrap            = "maintain"
"html.useTabs"      = false
embedded            = { js = ["exec"], json = ["exec"], jsonc = ["exec"], ts = ["exec"] }

[[markdown.overrides]]
files             = ["README.md", "docs/**/*.md"]
lineWidth         = 60
"html.skipFormat" = true

[[markdown.overrides]]
files               = ["CHANGELOG.md"]
lineWidth           = 320
textWrap            = "never"
"codeBlock.useTabs" = false

[markup]
"html.void.selfClosing" = false
formatComments          = true
scriptIndent            = true
styleIndent             = true
"vue.scriptIndent"      = true
"vue.styleIndent"       = true
scriptFormatter         = "biome"

[yaml]
printWidth = 160

[svg]
useTabs = false

[ruff]
preview     = true
indentWidth = 4

[exec]
playWithFire = true
cwd          = "${configDir}"
associations = ["!**"]

[[exec.commands]]
exts    = ["js", "json", "jsonc", "ts"]
command = [
  "node_modules/.bin/biome",
  "format",
  "--stdin-file-path={{file_path}}",
  "--javascript-formatter-enabled=true",
  "--javascript-formatter-indent-style=space",
  "--javascript-formatter-indent-width={{indent_width}}",
  "--javascript-formatter-line-width={{line_width}}",
  "--json-formatter-enabled=true",
  "--json-formatter-indent-style=space",
  "--json-formatter-indent-width={{indent_width}}",
  "--json-formatter-line-width={{line_width}}",
]
