#:schema https://unpkg.com/wrangler@4/config-schema.json

name               = "dreamcli"
compatibility_date = "2026-04-02"
workers_dev        = true
preview_urls       = true

main = "docs/worker.ts"

[assets]
binding            = "ASSETS"
directory          = "docs/.vitepress/dist"
not_found_handling = "single-page-application"
html_handling      = "drop-trailing-slash"
# Assets are served without invoking the worker unless it runs first, which is
# what lets `Accept: text/markdown` reach the negotiation logic. Only page
# routes need it; hashed bundles and images go straight to the asset cache.
run_worker_first   = [
  "/*",
  "!/assets/*",
  "!/icons/*",
  "!/animations/*",
  "!/*.png",
  "!/*.svg",
  "!/*.ico",
  "!/*.css",
  "!/*.js",
  "!/*.json",
  "!/*.xml",
]

[[routes]]
custom_domain = true
pattern       = "dreamcli.kjanat.dev"

[[routes]]
custom_domain = true
pattern       = "dreamcli.kjanat.com"
