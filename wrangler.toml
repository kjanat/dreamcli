#:schema https://unpkg.com/wrangler@4/config-schema.json

name               = "dreamcli"
compatibility_date = "2026-04-02"
workers_dev        = true
preview_urls       = true

[assets]
directory          = "docs/.vitepress/dist"
not_found_handling = "single-page-application"
# `drop-trailing-slash` answered `/raw/` with a 307, and the Accept-based
# rewrite maps the site root to exactly that path, so an agent negotiating
# markdown on the homepage got a redirect instead of content.
html_handling      = "auto-trailing-slash"

[[routes]]
custom_domain = true
pattern       = "dreamcli.kjanat.dev"

[[routes]]
custom_domain = true
pattern       = "dreamcli.kjanat.com"
