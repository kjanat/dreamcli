name: bun-deno-runner
description: A GitHub Action to setup Bun and Deno environments for running scripts, with runner/run bins.
runs: {
  using: composite,
  steps: [
    { uses: kjanat/runner@master },
    { uses: denoland/setup-deno@v2 },
    { uses: oven-sh/setup-bun@v2, with: { bun-version: canary, no-cache: true } },
    { uses: actions/setup-node@v7, with: { node-version: latest } },
    { uses: kjanat/dprint-check@v3, with: { install-only: true } },
  ],
}
