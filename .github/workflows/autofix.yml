name: autofix.ci
on:
  push: { branches: [master] }
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions: { contents: read }
env: { MAINTENANCE_BRANCH: maintenance/autofix }
concurrency:
  group: "autofix-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  branch:
    if: github.repository == 'kjanat/dreamcli'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      master: ${{ steps.branch.outputs.master }}
      ordinary: ${{ steps.branch.outputs.ordinary }}
    steps:
      - id: branch
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          master=false
          ordinary=false
          # Beepboop exclusively owns the maintenance ref. A fork's branch is independent.
          if [[ "${GITHUB_REF}" == refs/heads/master ]]; then
            master=true
          elif [[ "${GITHUB_REF}" != "refs/heads/${MAINTENANCE_BRANCH}" ]] &&
               [[ "${PR_HEAD_REPO}" != "${GITHUB_REPOSITORY}" || "${GITHUB_HEAD_REF}" != "${MAINTENANCE_BRANCH}" ]]; then
            ordinary=true
          fi
          printf 'master=%s\nordinary=%s\n' "${master}" "${ordinary}" >> "${GITHUB_OUTPUT}"

  autofix:
    needs: [branch]
    if: ${{ needs.branch.outputs.ordinary == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.stack == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env: { RUNNER_PM: bun }
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/setup
      - run: runner install
      - run: run -s fmt:autofix lint:autofix
      - uses: autofix-ci/action@v1

  maintenance-pr:
    needs: [branch]
    if: ${{ needs.branch.outputs.master == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: { contents: read, id-token: write }
    env: { RUNNER_PM: bun }
    steps:
      - uses: actions/checkout@v7
        with: { ref: master }
      - uses: $/.github/actions/setup
      - run: runner install
      # `kprint config update` queries every plugin registry and may download
      # and compile new plugin versions; 20s starves legitimate runs.
      - run: bash scripts/ci-retry-hang.sh 90 run fmt:update
      - run: run -s fmt:autofix lint:autofix
      - name: Describe changes
        id: changes
        run: bun scripts/autofix-pr.ts
      - uses: kjanat/beepboop/actions/pull-request@v1
        # A clean checkout leaves any existing proposal for maintainers to close if obsolete.
        if: steps.changes.outputs.changed == 'true'
        with:
          branch: ${{ env.MAINTENANCE_BRANCH }}
          base: master
          title: ${{ steps.changes.outputs.title }}
          body: ${{ steps.changes.outputs.body }}
