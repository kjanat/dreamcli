name: autofix.ci
on:
  push: { branches: [master] }
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: "autofix-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  autofix:
    # Beepboop exclusively owns the maintenance ref. A fork's branch is independent.
    if: >- # actionlint:ignore case-insensitive-conditions -- also reserve case variants from ordinary autofix
      ${{ github.repository == 'kjanat/dreamcli' && case(
        github.ref == 'refs/heads/master' || github.ref == 'refs/heads/maintenance/autofix', false,
        github.event_name == 'pull_request',
          github.event.pull_request.stack == null &&
          (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'maintenance/autofix'),
        true
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env: { RUNNER_PM: bun }
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/setup
      - name: Refresh the weekly Renovate lockfile
        if: >- # actionlint:ignore case-insensitive-conditions -- only Renovate's own PRs are eligible
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'renovate/weekly-dev-dependencies'
        run: |
          rm bun.lock
          bun install --lockfile-only --ignore-scripts
      - run: runner install
      - run: run -s fmt:autofix lint:autofix
      - uses: autofix-ci/action@v1

  maintenance-pr:
    if: github.repository == 'kjanat/dreamcli' && github.ref_protected && github.ref == 'refs/heads/master' # actionlint:ignore case-insensitive-conditions -- master is protected and checkout pins the exact branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: { contents: read, id-token: write }
    env: { RUNNER_PM: bun }
    steps:
      - uses: actions/checkout@v7
        with: { ref: master }
      - uses: $/.github/actions/setup
      - run: runner install
      # `kprint config update` queries every plugin registry and may download
      # and compile new plugin versions; 20s starves legitimate runs.
      - run: bash scripts/ci-retry-hang.sh 90 run fmt:update
      - run: run -s fmt:autofix lint:autofix
      - name: Describe changes
        id: changes
        run: bun scripts/autofix-pr.ts
      - uses: kjanat/beepboop/actions/pull-request@v1
        # A clean checkout leaves any existing proposal for maintainers to close if obsolete.
        if: steps.changes.outputs.changed == 'true'
        with:
          branch: maintenance/autofix
          base: master
          title: ${{ steps.changes.outputs.title }}
          body: ${{ steps.changes.outputs.body }}
