name: autofix.ci
on:
  push: { branches: [master] }
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: "autofix-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  autofix:
    if: github.repository == 'kjanat/dreamcli' && github.ref != 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.stack == null)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env: { RUNNER_PM: bun }
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/setup
      - run: runner install
      - run: run -s fmt:autofix lint:autofix
      - uses: autofix-ci/action@v1

  maintenance-pr:
    if: github.repository == 'kjanat/dreamcli' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: { contents: read, id-token: write }
    env: { RUNNER_PM: bun }
    steps:
      - uses: actions/checkout@v7
        with: { ref: master }
      - uses: $/.github/actions/setup
      - run: runner install
      # `dprint config update` queries every plugin registry and may download
      # and compile new plugin versions; 20s starves legitimate runs.
      - run: bash scripts/ci-retry-hang.sh 90 run fmt:update
      - run: run -s fmt:autofix lint:autofix
      - name: Describe changes
        id: changes
        run: bun scripts/autofix-pr.ts
      - uses: kjanat/beepboop/actions/pull-request@v1
        if: steps.changes.outputs.changed == 'true'
        with:
          branch: maintenance/autofix
          base: master
          title: ${{ steps.changes.outputs.title }}
          body: ${{ steps.changes.outputs.body }}
