name: Publish to npm

on:
  release: { types: [published] }
  workflow_dispatch:

permissions: { contents: read }
env: { RUNNER_PM: bun }

jobs:
  meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    env: { RELEASE_TAG: "${{ github.event.release.tag_name }}", RELEASE_TARGET: npm }
    outputs: { meta: "${{ steps.version.outputs.meta }}" }
    steps: [
      { uses: actions/checkout@v7, with: { sparse-checkout: "package.json\ndeno.json\nscripts/release-meta.sh" } },
      { id: version, run: bash scripts/release-meta.sh },
    ]

  build:
    name: Build
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: { tarball: "${{ steps.pack.outputs.tarball }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: kjanat/runner@master
      - uses: oven-sh/setup-bun@v2
      - run: runner install --frozen schema:emit version:check build
      - id: pack
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tr -d '[:space:]')" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7
        with: { name: tarball, path: "${{ steps.pack.outputs.tarball }}", retention-days: 1 }

  publish:
    name: Publish
    needs: [meta, build]
    env: { TARBALL: "${{ needs.build.outputs.tarball }}" }
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: { name: npm, url: "${{ fromJSON(needs.meta.outputs.meta).url }}" }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: ".node-version\npackage.json" }
      - { uses: actions/setup-node@v6, with: { node-version-file: .node-version, registry-url: https://registry.npmjs.org/ } }
      - { uses: actions/download-artifact@v8, with: { name: tarball } }
      - name: Publish to npm
        env:
          VERSION: ${{ fromJSON(needs.meta.outputs.meta).version }}
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_CONFIG_PROVENANCE || 'true' }}
          NPM_VERSION: ${{ vars.NPM_VERSION }}
        run: |
          npm_version="$(jq -er '.volta.npm // env.NPM_VERSION // empty' package.json)"
          npm install -g "npm@${npm_version}"
          # Prerelease versions (e.g. 3.0.0-rc.1) publish under the `next`
          # dist-tag so they never become the default `latest` install.
          case "${VERSION}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "Publishing ${VERSION} under dist-tag '${dist_tag}'"
          npm publish "${TARBALL}" --access public --tag "${dist_tag}"
