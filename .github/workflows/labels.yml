name: Sync Labels
run-name: "Sync Labels ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}-${{ github.run_number }} by ${{ github.actor }}"
on:
  push: { branches: [master], paths: [.github/labels.yml, .github/workflows/labels.yml] }
  workflow_dispatch:

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, issues: write }
    steps: [uses: actions/checkout@v7, uses: kjanat/github-labelmanager@v1]
