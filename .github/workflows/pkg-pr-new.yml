name: pkg.pr.new

on:
  push: { branches: [master] }
  pull_request: { branches: [master], types: [opened, synchronize, reopened, ready_for_review] }

concurrency: { group: "pkg-pr-new-${{ github.event.pull_request.number || github.ref_name }}", cancel-in-progress: true }
permissions: { contents: read }
env: { RUNNER_PM: bun }

jobs:
  publish:
    name: Publish Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: [uses: actions/checkout@v7, uses: kjanat/runner@master, uses: oven-sh/setup-bun@v2, run: runner install --frozen build publish:preview]
