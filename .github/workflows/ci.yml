name: CI
run-name: "${{ github.workflow }} - ${{ github.ref_name }} - ${{ github.event_name }} by ${{ github.actor }}"

on: { push: { branches: [master] }, pull_request: { branches: [master] } }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
env: { RUNNER_PM: bun }

jobs:
  lint:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: runner install --frozen schema:emit version:check
      - run: run -pk typecheck meta-descriptions:check lint format:check typecheck:gh

  test:
    name: test (node ${{ matrix.node-version }}, bun latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: { matrix: { node-version: [22.22.2, latest] }, fail-fast: false }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node-version }}" }
      - run: runner install --frozen schema:emit
      - name: Test in parallel (Bun) (Node ${{ matrix.node-version }})
        run: run -pk test:bun test:gh test:node

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: runner install --frozen schema:emit coverage

  test-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: runner install --frozen build smoke vitest:deno

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: runner install --frozen schema:emit docs:build
      - run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, coverage, test-deno, docs]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: runner install --frozen build
