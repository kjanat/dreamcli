name: Publish
run-name: Publish ${{ github.event.release.tag_name || github.ref_name }}

on:
  release: { types: [published] }
  workflow_dispatch:

permissions: { contents: read }
env: { RUNNER_PM: bun }

jobs:
  meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    env: { RELEASE_TAG: "${{ github.event.release.tag_name }}" }
    outputs:
      npm: ${{ steps.npm.outputs.meta }}
      jsr: ${{ steps.jsr.outputs.meta }}
    steps: [
      { uses: actions/checkout@v7, with: { sparse-checkout: "package.json\ndeno.json\nscripts/release-meta.sh" } },
      { id: npm, run: bash scripts/release-meta.sh npm },
      { id: jsr, run: bash scripts/release-meta.sh jsr },
    ]

  checks:
    name: Pre-Publish Checks
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs: { tarball: "${{ steps.pack.outputs.tarball }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: runner install --frozen
      - run: run -s schema:emit version:check ci smoke
      - id: pack
        run: tarball="$(bun pm pack --quiet --ignore-scripts)"; echo "tarball=${tarball//$'\n'/}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with: { name: tarball, path: "${{ steps.pack.outputs.tarball }}", retention-days: 1 }

  publish-npm:
    name: Publish to npm
    needs: [meta, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { TARBALL: "${{ needs.checks.outputs.tarball }}" }
    environment: { name: npm, url: "${{ fromJSON(needs.meta.outputs.npm).url }}" }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: ".node-version\npackage.json" }
      - { uses: actions/setup-node@v7, with: { node-version-file: .node-version, registry-url: https://registry.npmjs.org/, package-manager-cache: false } }
      - { uses: actions/download-artifact@v8, with: { name: tarball } }
      - name: Publish to npm
        env:
          VERSION: ${{ fromJSON(needs.meta.outputs.npm).version }}
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_CONFIG_PROVENANCE || 'true' }}
          NPM_VERSION: ${{ vars.NPM_VERSION }}
        run: |
          npm_version="$(jq -er '.volta.npm // env.NPM_VERSION // empty' package.json)"
          npm install -g "npm@${npm_version}"
          # Prerelease versions (e.g. 3.0.0-rc.1) publish under the `next`
          # dist-tag so they never become the default `latest` install.
          case "${VERSION}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "Publishing ${VERSION} under dist-tag '${dist_tag}'"
          npm publish "${TARBALL}" --access public --tag "${dist_tag}"

  publish-jsr:
    name: Publish to JSR
    needs: [meta, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: { name: jsr, url: "${{ fromJSON(needs.meta.outputs.jsr).url }}" }
    permissions: { id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: runner install -fK build jsr:publish

  deploy-site:
    name: Deploy Site
    needs: [publish-npm, publish-jsr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: { name: cf, url: "${{ vars.URL }}" }
    steps:
      # The docs site embeds the published version, so it is rebuilt only once
      # both registries carry the release.
      - name: Trigger Cloudflare build
        run: curl --fail --silent --show-error -X POST "${WEBHOOK}"
        env: { WEBHOOK: "${{ vars.WEBHOOK }}" }
