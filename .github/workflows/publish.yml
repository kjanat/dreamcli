name: Publish
run-name: ${{ inputs.beepboop_title || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop execution ID
        required: true
        type: string
      beepboop_title:
        description: Release title
        type: string

permissions: { contents: read }
env: { RUNNER_PM: bun }

jobs:
  meta:
    name: Resolve Release Metadata
    if: github.repository == 'kjanat/dreamcli'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    outputs:
      source-sha: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
      execution-id: ${{ steps.beepboop.outputs.execution-id }}
      force: ${{ fromJSON(steps.beepboop.outputs.context).force == true }}
      npm: ${{ steps.npm.outputs.meta }}
      jsr: ${{ steps.jsr.outputs.meta }}
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: dreamcli
          operation: publish
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
          persist-credentials: false
          sparse-checkout: "package.json\ndeno.json\nscripts/release-meta.sh"
      - { id: npm, run: bash scripts/release-meta.sh npm }
      - { id: jsr, run: bash scripts/release-meta.sh jsr }

  checks:
    name: Pre-Publish Checks
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs: { tarball: "${{ steps.pack.outputs.tarball }}" }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify and check out release commit
        env: { RELEASE_SHA: "${{ needs.meta.outputs.source-sha }}" }
        run: |
          [[ "${GITHUB_REF}" == refs/heads/master ]]
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${RELEASE_SHA}" HEAD
          git checkout --detach "${RELEASE_SHA}"
      - uses: $/.github/actions/setup
      - run: runner install --frozen
      - run: run -s schema:emit version:check ci smoke
        continue-on-error: ${{ fromJSON(needs.meta.outputs.force) }}
        timeout-minutes: 10
      - run: run -s build
      - id: pack
        run: tarball="$(bun pm pack --quiet --ignore-scripts)"; echo "tarball=${tarball//$'\n'/}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7
        with: { name: tarball, path: "${{ steps.pack.outputs.tarball }}", retention-days: 1 }

  publish-npm:
    name: Publish to npm
    needs: [meta, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { TARBALL: "${{ needs.checks.outputs.tarball }}" }
    environment: { name: npm, url: "${{ fromJSON(needs.meta.outputs.npm).url }}" }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.meta.outputs.source-sha }}", persist-credentials: false, sparse-checkout: ".node-version\npackage.json" }
      - { uses: actions/setup-node@v7, with: { node-version-file: .node-version, registry-url: https://registry.npmjs.org/, package-manager-cache: false } }
      - { uses: actions/download-artifact@v8, with: { name: tarball } }
      - name: Publish to npm
        id: publish
        env:
          VERSION: ${{ fromJSON(needs.meta.outputs.npm).version }}
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_CONFIG_PROVENANCE || 'true' }}
          NPM_VERSION: ${{ vars.NPM_VERSION }}
        run: |
          npm_version="$(jq -er '.volta.npm // env.NPM_VERSION // empty' package.json)"
          npm install -g "npm@${npm_version}"
          # Prerelease versions (e.g. 3.0.0-rc.1) publish under the `next`
          # dist-tag so they never become the default `latest` install.
          case "${VERSION}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "Publishing ${VERSION} under dist-tag '${dist_tag}'"
          npm publish "./${TARBALL}" --access public --tag "${dist_tag}"

      - name: Report npm publication
        if: ${{ !cancelled() }}
        uses: kjanat/beepboop/actions/report@v1
        with:
          execution-id: ${{ needs.meta.outputs.execution-id }}
          publications: >-
            [{"id":"pkg:npm/%40kjanat/dreamcli","manager":"npm","name":"@kjanat/dreamcli",
            "version":"${{ fromJSON(needs.meta.outputs.npm).version }}","required":true,
            "outcome":"${{ steps.publish.outcome == 'success' && 'succeeded' || 'failed' }}"}]

  publish-jsr:
    name: Publish to JSR
    needs: [meta, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: { name: jsr, url: "${{ fromJSON(needs.meta.outputs.jsr).url }}" }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.meta.outputs.source-sha }}", persist-credentials: false }
      - uses: $/.github/actions/setup
      - id: publish
        run: runner install -fK build ${{ case(fromJSON(needs.meta.outputs.force), 'jsr:publish:force', 'jsr:publish') }}
      - name: Report jsr publication
        if: ${{ !cancelled() }}
        uses: kjanat/beepboop/actions/report@v1
        with:
          execution-id: ${{ needs.meta.outputs.execution-id }}
          publications: >-
            [{"id":"pkg:jsr/%40kjanat/dreamcli","manager":"jsr","name":"@kjanat/dreamcli",
            "version":"${{ fromJSON(needs.meta.outputs.jsr).version }}","required":true,
            "outcome":"${{ steps.publish.outcome == 'success' && 'succeeded' || 'failed' }}"}]

  github-release:
    name: Publish GitHub Release
    needs: [meta, publish-npm, publish-jsr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, id-token: write }
    env: { BEEPBOOP_EXECUTION_ID: "${{ needs.meta.outputs.execution-id }}" }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.meta.outputs.source-sha }}", persist-credentials: false }
      - uses: kjanat/beepboop/actions/token@v1
        id: token
        with:
          execution-id: ${{ needs.meta.outputs.execution-id }}
          permission-contents: write
      - name: Publish version tag
        uses: kjanat/beepboop/actions/publish-refs@v1
        with: { token: "${{ steps.token.outputs.token }}" }
        env: { "${{ insert }}": "${{ fromJSON(steps.token.outputs.gitId || '{}') }}" }
      - uses: kjanat/beepboop/actions/publish-release@v1
        with: { execution-id: "${{ needs.meta.outputs.execution-id }}" }

  deploy-site:
    name: Deploy Site
    needs: [publish-npm, publish-jsr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: { name: cf, url: "${{ vars.URL }}" }
    steps:
      # The docs site embeds the published version, so it is rebuilt only once
      # both registries carry the release.
      - name: Trigger Cloudflare build
        run: curl --fail --silent --show-error -X POST "${WEBHOOK}"
        env: { WEBHOOK: "${{ vars.WEBHOOK }}" }
