name: Publish to JSR

on:
  release: { types: [published] }
  workflow_dispatch:

permissions: { contents: read }
env: { RUNNER_PM: bun }

jobs:
  meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    env: { RELEASE_TAG: "${{ github.event.release.tag_name }}", RELEASE_TARGET: jsr }
    outputs: { meta: "${{ steps.version.outputs.meta }}" }
    steps: [uses: actions/checkout@v7, { id: version, run: bash scripts/release-meta.sh }]

  checks:
    name: Pre-Publish Checks
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: kjanat/runner@master
      - uses: denoland/setup-deno@v2
      - uses: oven-sh/setup-bun@v2
      - run: runner install --frozen --kill-on-fail version:check ci smoke

  publish:
    name: Publish to JSR
    needs: [meta, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: { name: jsr, url: "${{ fromJSON(needs.meta.outputs.meta).url }}" }
    permissions: { id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: kjanat/runner@master
      - uses: denoland/setup-deno@v2
      - uses: oven-sh/setup-bun@v2
      - run: runner install --frozen --kill-on-fail build jsr:publish
