<svg viewBox="0 0 720 520" font-family="Inter, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title>
    Theme 2 Dark: Neutral Base + Brand Accents
  </title>

  <!-- Background -->
  <rect rx="8" width="720" height="520" fill="#1b1b1f" />

  <!-- Title -->
  <text x="360" y="32"
        fill="#dfdfd6"
        font-size="14" font-weight="600" text-anchor="middle">
    Theme 2 Dark — Neutral + Brand Accents
  </text>
  <text x="360" y="50"
        fill="#98989f"
        font-size="11" text-anchor="middle">
    Dark gray nodes, indigo borders &amp; highlights, clean technical feel
  </text>

  <!-- ════ Flowchart area ════ -->
  <text x="30" y="82" fill="#dfdfd6" font-size="11" font-weight="600">
    Flowchart
  </text>

  <!-- Node A: primary (dark gray fill, indigo border) -->
  <rect x="40" y="96" rx="5" width="120" height="40"
        fill="#252529" stroke="#a8b1ff" stroke-width="1.5" />
  <text x="100" y="121" fill="#dfdfd6" font-size="12" text-anchor="middle">
    CLI Parse
  </text>

  <!-- Edge A->B -->
  <line x1="160" y1="116" x2="220" y2="116"
        stroke="#515c67" stroke-width="1.2"
        marker-end="url(#arrow2d)" />
  <text x="190" y="108" fill="#98989f" font-size="9" text-anchor="middle">
    args
  </text>

  <!-- Node B: secondary (neutral, muted border) -->
  <rect x="220" y="96" rx="5" width="120" height="40"
        fill="#252529" stroke="#3c3f44" stroke-width="1.5" />
  <text x="280" y="121" fill="#dfdfd6" font-size="12" text-anchor="middle">
    Validate
  </text>

  <!-- Edge B->C -->
  <line x1="340" y1="116" x2="400" y2="116"
        stroke="#515c67" stroke-width="1.2"
        marker-end="url(#arrow2d)" />

  <!-- Node C: tertiary -->
  <rect x="400" y="96" rx="5" width="120" height="40"
        fill="#28271f" stroke="#8090e0" stroke-width="1.5" />
  <text x="460" y="121" fill="#dfdfd6" font-size="12" text-anchor="middle">
    Execute
  </text>

  <!-- Diamond node -->
  <polygon points="600,96 640,116 600,136 560,116"
           fill="#252529" stroke="#a8b1ff" stroke-width="1.5" />
  <text x="600" y="120" fill="#dfdfd6" font-size="10" text-anchor="middle">
    ok?
  </text>

  <!-- Edge C->Diamond -->
  <line x1="520" y1="116" x2="560" y2="116"
        stroke="#515c67" stroke-width="1.2"
        marker-end="url(#arrow2d)" />

  <!-- Cluster/subgraph -->
  <rect x="30" y="160" rx="6" width="310" height="100"
        fill="#1f1f24" stroke="#a8b1ff" stroke-width="1" opacity="0.8" stroke-dasharray="4 2" />
  <text x="40" y="178"
        fill="#a8b1ff"
        font-size="10" font-weight="600">
    subgraph: Config Resolution
  </text>

  <rect x="50" y="192" rx="5" width="100" height="36"
        fill="#252529" stroke="#3c3f44" stroke-width="1.2" />
  <text x="100" y="214" fill="#dfdfd6" font-size="11" text-anchor="middle">
    File
  </text>

  <rect x="180" y="192" rx="5" width="100" height="36"
        fill="#252529" stroke="#3c3f44" stroke-width="1.2" />
  <text x="230" y="214" fill="#dfdfd6" font-size="11" text-anchor="middle">
    Env
  </text>

  <line x1="150" y1="210" x2="180" y2="210"
        stroke="#515c67" stroke-width="1"
        marker-end="url(#arrow2d)" />

  <!-- Note (indigo accent) -->
  <rect x="380" y="168" rx="3" width="160" height="48"
        fill="#252538" stroke="#a8b1ff" stroke-width="1" />
  <text x="460" y="188"
        fill="#dfdfd6"
        font-size="10" text-anchor="middle">
    Note: precedence is
  </text>
  <text x="460" y="202"
        fill="#dfdfd6"
        font-size="10" text-anchor="middle">
    argv > env > config
  </text>

  <!-- ════ Sequence area ════ -->
  <text x="30" y="296" fill="#dfdfd6" font-size="11" font-weight="600">
    Sequence
  </text>

  <!-- Actor boxes -->
  <rect x="60" y="310" rx="4" width="80" height="32"
        fill="#252529" stroke="#a8b1ff" stroke-width="1.2" />
  <text x="100" y="330" fill="#dfdfd6" font-size="11" text-anchor="middle">
    User
  </text>

  <rect x="240" y="310" rx="4" width="80" height="32"
        fill="#252529" stroke="#a8b1ff" stroke-width="1.2" />
  <text x="280" y="330" fill="#dfdfd6" font-size="11" text-anchor="middle">
    CLI
  </text>

  <rect x="420" y="310" rx="4" width="80" height="32"
        fill="#252529" stroke="#a8b1ff" stroke-width="1.2" />
  <text x="460" y="330" fill="#dfdfd6" font-size="11" text-anchor="middle">
    Plugin
  </text>

  <!-- Lifelines -->
  <line x1="100" y1="342" x2="100" y2="460"
        stroke="#3c3f44" stroke-width="1" stroke-dasharray="4 3" />
  <line x1="280" y1="342" x2="280" y2="460"
        stroke="#3c3f44" stroke-width="1" stroke-dasharray="4 3" />
  <line x1="460" y1="342" x2="460" y2="460"
        stroke="#3c3f44" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Message 1 -->
  <line x1="100" y1="362" x2="280" y2="362"
        stroke="#dfdfd6" stroke-width="1.2"
        marker-end="url(#arrow2d)" />
  <text x="190" y="356" fill="#dfdfd6" font-size="10" text-anchor="middle">
    run(cmd)
  </text>

  <!-- Activation (indigo accent) -->
  <rect x="274" y="362" width="12" height="50" fill="#2a2a40" stroke="#a8b1ff" stroke-width="1" />

  <!-- Message 2 -->
  <line x1="280" y1="382" x2="460" y2="382"
        stroke="#dfdfd6" stroke-width="1.2"
        marker-end="url(#arrow2d)" />
  <text x="370" y="376" fill="#dfdfd6" font-size="10" text-anchor="middle">
    hook(pre)
  </text>

  <!-- Return -->
  <line x1="460" y1="400" x2="280" y2="400"
        stroke="#515c67" stroke-width="1.2" stroke-dasharray="4 2"
        marker-end="url(#arrow2d)" />
  <text x="370" y="394" fill="#98989f" font-size="10" text-anchor="middle">
    result
  </text>

  <!-- Message 3 return -->
  <line x1="280" y1="430" x2="100" y2="430"
        stroke="#515c67" stroke-width="1.2" stroke-dasharray="4 2"
        marker-end="url(#arrow2d)" />
  <text x="190" y="424" fill="#98989f" font-size="10" text-anchor="middle">
    output
  </text>

  <!-- ════ Gantt snippet ════ -->
  <text x="560" y="296" fill="#dfdfd6" font-size="11" font-weight="600">
    Gantt
  </text>

  <rect x="560" y="310" rx="3" width="140" height="20"
        fill="#5c73e7" stroke="#a8b1ff" stroke-width="1" />
  <text x="630" y="324" fill="#fff" font-size="9" text-anchor="middle">
    Parse args
  </text>

  <rect x="580" y="336" rx="3" width="120" height="20"
        fill="#32363f" stroke="#3c3f44" stroke-width="1" />
  <text x="640" y="350" fill="#dfdfd6" font-size="9" text-anchor="middle">
    Validate
  </text>

  <rect x="600" y="362" rx="3" width="80" height="20"
        fill="#32363f" stroke="#3c3f44" stroke-width="1" />
  <text x="640" y="376" fill="#dfdfd6" font-size="9" text-anchor="middle">
    Execute
  </text>

  <rect x="560" y="394" rx="3" width="140" height="20"
        fill="#202127" stroke="#2e2e32" stroke-width="1" />
  <text x="630" y="408" fill="#515c67" font-size="9" text-anchor="middle">
    Done
  </text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow2d" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dfdfd6" />
    </marker>
  </defs>

  <!-- Footer -->
  <text x="360" y="500"
        fill="#515c67"
        font-size="10" text-anchor="middle">
    primaryColor=#252529  primaryBorderColor=#a8b1ff  lineColor=#515c67  noteBkgColor=#252538
  </text>
</svg>
